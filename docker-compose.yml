# TerraPulse local Kafka stack (single broker, no auth).
#
# Zookeeper: older Kafka (pre-KRaft) needs Zookeeper to store cluster
# metadata and coordinate brokers. We keep Zookeeper mode here to stay
# simple for local development — no KRaft controller setup required.
#
# Two Kafka listeners: containers on the Docker network reach the broker as
# kafka:29092 (PLAINTEXT). Apps on the Windows host (Python ML engine,
# Spring Boot) reach it as localhost:9092 (PLAINTEXT_HOST). Without both,
# either Docker-to-Docker or host-to-Kafka connections fail.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: terrapulse-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Use the admin HTTP API (port 8080 inside the container). Newer ZooKeeper
      # disables four-letter words like ruok on 2181 by default.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/commands/ruok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: terrapulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
