spring.application.name=terrapulse-backend
server.port=8080

# PostgreSQL (configure for your environment)
spring.datasource.url=jdbc:postgresql://localhost:5432/terrapulse
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Kafka (configure for your environment)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=terrapulse-backend

# Disable auto-configuration when services are not available during local dev
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
