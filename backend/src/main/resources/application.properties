# TerraPulse Backend — database configuration notes
#
# spring.jpa.hibernate.ddl-auto=update
#   Hibernate looks at your @Entity classes and creates/alters tables to match.
#   Handy while we are still shaping the schema in development.
#   Do NOT use "update" in production — prefer Flyway/Liquibase migrations so
#   schema changes are explicit, reviewed, and reversible.
#
# ${DB_USERNAME:postgres}
#   Spring reads the DB_USERNAME environment/property value; if it is missing,
#   it falls back to "postgres". ${DB_PASSWORD} has no default — you must set it.
#
# .env loading
#   Spring Boot does not read .env files by itself (unlike Python's python-dotenv).
#   We added me.paulschwarz:springboot3-dotenv so backend/.env is loaded into the
#   Spring Environment automatically when you run from the backend/ folder.
#   That is the simplest local-dev approach: keep secrets in .env (gitignored),
#   commit .env.example as a template. You can still override with real OS env
#   vars or IDE run-configuration env if you prefer.

spring.application.name=terrapulse-backend
server.port=8080

# Python ML engine (FastAPI). Change this per environment without touching Java code.
ml.engine.base-url=http://localhost:8000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/terrapulse_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka consumer (host apps use localhost:9092 from docker-compose PLAINTEXT_HOST)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=terrapulse-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# StringDeserializer + manual Jackson parse: more reliable for Python producers,
# which send plain JSON without Spring JsonDeserializer type headers.
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
